      <stop offset="0" stop-color="#1e6b63"/>
      <stop offset="0.15" stop-color="#35998e"/>
      <stop offset="0.3" stop-color="#1e6b63"/>
      <stop offset="1" stop-color="#1e6b63"/>
    </linearGradient>
    <linearGradient id="left-body" x1="12" y1="18" x2="84" y2="86" gradientUnits="userSpaceOnUse">
