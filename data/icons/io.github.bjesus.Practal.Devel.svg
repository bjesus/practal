      <stop offset="1" stop-color="#289488"/>
    </linearGradient>
    <linearGradient id="right-lip" x1="40" y1="112" x2="116" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a5c3a"/>
