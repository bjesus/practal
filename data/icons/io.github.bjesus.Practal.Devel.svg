  <!-- Crisp checkmark inside right bubble -->
  <path d="M 61 75 L 72 86 L 94 63" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Devel hazard stripe badge -->
  <g clip-path="url(#devel-clip)">
    <rect x="64" y="10" width="54" height="22" fill="#f5c211"/>
    <path d="M 58 34 L 74 8 M 74 34 L 90 8 M 90 34 L 106 8 M 106 34 L 122 8" stroke="#241f31" stroke-width="7"/>
