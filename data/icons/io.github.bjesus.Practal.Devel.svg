  <!-- Left (other's) bubble bottom lip + tail -->
  <path d="M 28 24 H 74 C 82.8 24 90 31.2 90 40 V 72 C 90 80.8 82.8 88 74 88 H 35 L 21 98 C 18.5 99.8 15 98 15 94.8 V 85.2 C 13.1 82.4 12 79 12 75.2 V 40 C 12 31.2 19.2 24 28 24 Z" fill="url(#bg-left-lip)"/>
  <!-- Left bubble face -->
