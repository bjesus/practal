  <!-- Subtle message lines in left bubble -->
  <rect x="24" y="37" width="38" height="6" rx="3" fill="#ffffff" fill-opacity="0.75"/>
  <rect x="24" y="49" width="26" height="6" rx="3" fill="#ffffff" fill-opacity="0.5"/>

  <!-- Right (own) bubble bottom lip + tail -->
  <path d="M 54 48 H 100 C 108.8 48 116 55.2 116 64 V 96 C 116 99.8 114.9 103.2 113 106 V 115.6 C 113 118.8 109.5 120.6 107 118.8 L 93 108.8 H 54 C 45.2 108.8 38 101.6 38 92.8 V 64 C 38 55.2 45.2 48 54 48 Z" fill="url(#right-lip)"/>
  <!-- Right bubble face -->
