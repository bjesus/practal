      <stop offset="0.85" stop-color="#2fa366"/>
      <stop offset="1" stop-color="#1a5c3a"/>
    </linearGradient>
    <linearGradient id="right-body" x1="42" y1="44" x2="114" y2="108" gradientUnits="userSpaceOnUse">
